<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Container Days URP</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; }
  body {
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #stage {
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  #slide {
    max-width:100vw;
    max-height:100vh;
    width:auto;
    height:auto;
    object-fit:contain;
    user-select:none;
    -webkit-user-drag:none;
  }
  .nav {
    position:fixed;
    top:50%;
    transform:translateY(-50%);
    width:52px;
    height:52px;
    border:0;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:#fff;
    font-size:30px;
    cursor:pointer;
    z-index:10;
    transition:.2s;
  }
  .nav:hover { background:rgba(0,0,0,.8); transform:translateY(-50%) scale(1.08); }
  #prev { left:22px; }
  #next { right:22px; }
  #counter {
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    background:rgba(0,0,0,.55);
    padding:7px 14px;
    border-radius:20px;
    font-size:14px;
    z-index:10;
  }
  #fullscreen {
    position:fixed;
    top:18px;
    right:18px;
    border:0;
    border-radius:10px;
    background:rgba(0,0,0,.55);
    color:#fff;
    padding:9px 12px;
    cursor:pointer;
    z-index:10;
  }
  #fullscreen:hover { background:rgba(0,0,0,.8); }
</style>
</head>
<body>

<div id="stage">
  <img id="slide" src="slides/slide-01.png" alt="Slide">
</div>

<button id="prev" class="nav" aria-label="Anterior">‹</button>
<button id="next" class="nav" aria-label="Siguiente">›</button>
<button id="fullscreen">⛶</button>
<div id="counter">1 / 7</div>

<script>
const slides = [
  "slides/slide-01.png",
  "slides/slide-02.png",
  "slides/slide-03.png",
  "slides/slide-04.png",
  "slides/slide-05.png",
  "slides/slide-06.png",
  "slides/slide-07.png"
];

let current = 0;
const img = document.getElementById("slide");
const counter = document.getElementById("counter");

function showSlide(index) {
  current = (index + slides.length) % slides.length;
  img.src = slides[current];
  counter.textContent = `${current + 1} / ${slides.length}`;
}

document.getElementById("prev").onclick = () => showSlide(current - 1);
document.getElementById("next").onclick = () => showSlide(current + 1);

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") showSlide(current - 1);
  if (e.key === "ArrowRight" || e.key === " ") showSlide(current + 1);
  if (e.key === "Escape") document.exitFullscreen?.();
});

document.getElementById("fullscreen").onclick = () => {
  document.documentElement.requestFullscreen?.();
};

showSlide(0);
</script>

</body>
</html>

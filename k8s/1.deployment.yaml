---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tetris-deployment
spec:
  replicas: 2  # You can adjust the number of replicas as needed
  selector:
    matchLabels:
      app: tetris
  template:
    metadata:
      labels:
        app: tetris
    spec:
      containers:
      - name: tetris
        image: guopingjia/tetris:cfe-demo
        ports:
        - containerPort: 3000   # Use port 3000
---
apiVersion: v1
kind: Service
metadata:
  name: tetris-service
spec:
  type: ClusterIP
  selector:
    app: tetris
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
